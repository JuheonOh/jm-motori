name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.deploy-decision.outputs.should_deploy }}
    env:
      VITE_NAVER_MAP_CLIENT_ID: ${{ vars.VITE_NAVER_MAP_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync RSS cache
        id: rss
        env:
          RSS_CACHE_COMPARE_URL: https://jm-motori.co.kr/data/blog-feed.json
        run: npm run sync:rss

      - name: Decide deployment
        id: deploy-decision
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.rss.outputs.rss_changed }}" != "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "RSS cache is unchanged; skipping Pages deployment."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.deploy-decision.outputs.should_deploy == 'true'
        run: npm ci

      - name: Build
        if: steps.deploy-decision.outputs.should_deploy == 'true'
        run: npm run build

      - name: Configure Pages
        if: steps.deploy-decision.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.deploy-decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
